    <meta charset="UTF-8" />

    <meta name="twitter:card" content="summary_large_image" />
    <!-- Prevent theme flash before DOM render -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('manobal_theme_preference') || localStorage.getItem('manobah_theme_preference') || 'system';
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var active = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', active);
          document.documentElement.classList.add(active);
          if (document.body) {
            document.body.style.backgroundColor = isDark ? '#07090B' : '#E2E8E4';
          }
        } catch (e) {}
      })();
    </script>
    <!-- Editorial Serif & Modern Sans Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
